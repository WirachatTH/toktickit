version: '3.8'
# Add a name so my friend and I can have two containers simultaneously
name: wirachat-toktickit
services:
  db:
    image: postgres:15-alpine
    container_name: toktickit-db
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: toktickit-server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: toktickit-client
    ports:
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      # Issue 9 — e2e/ lives at the repo root, a sibling of client/ and
      # server/, not inside either. Mounted at /e2e (a sibling of /app, the
      # client mount) so `npx playwright test ../e2e/...` run from /app
      # resolves the same way the docs/lab-02/tests.md command expects.
      - ./e2e:/e2e
      # Issue 9 E2E globalTeardown deletes attachment files the journey
      # test uploaded through the real app — the same server/uploads the
      # `server` service writes to (attachmentStorage.ts's UPLOAD_DIR),
      # bind-mounted here too since the client container otherwise has no
      # path to it.
      - ./server/uploads:/server-uploads
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Issue 9 E2E globalTeardown connects directly to Postgres (via the
      # `pg` package) to remove the tickets/attachments the journey test
      # created — same credentials as server/.env's DATABASE_URL, reachable
      # here over the same Compose network.
      - DATABASE_URL=postgresql://toktickit:toktickit@db:5432/toktickit?schema=public
    depends_on:
      - server
    # /e2e isn't nested under /app, so a file under /e2e can't reach
    # /app/node_modules via Node's normal directory walk to resolve
    # `@playwright/test` — a second copy (or a second bind mount of the
    # same volume, tried first) resolves to a *different* path than
    # /app/node_modules and Playwright refuses to load itself twice under
    # two identities. A symlink is the fix: Node resolves a symlinked
    # node_modules to its real target before deciding module identity, so
    # both import sites collapse onto the exact same instance. `-sfn`
    # makes this idempotent across container restarts; only ever runs
    # inside the container, so it never touches the host's real e2e/.
    command: sh -c "ln -sfn /app/node_modules /e2e/node_modules && npm run dev -- --host"

volumes:
  pgdata:
  client_node_modules:
